<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SCP Tactical Mesh Console</title>
    
    <!-- PWA MOBILE APP SYSTEM INJECTIONS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05070a">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22SCP%20Mesh%22,%22short_name%22:%22SCPMesh%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22#05070a%22,%22theme_color%22:%22#05070a%22,%22icons%22:[{%22src%22:%22https://github.io}]} (Webpage Sent)">

    <style>
        :root {
            --bg-main: #05070a; --panel-bg: #0b0e14; --scp-red: #ff2222;
            --neon-cyan: #00ffcc; --border: #141b26; --bubble-me: #162536; --bubble-them: #0f1218;
        }
        body, html { margin:0; padding:0; width:100%; height:100%; background:var(--bg-main); color:#f8f8f2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
        
        /* GLOWING AUTH LOCK OVERLAY */
        #auth-panel { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-main); z-index:9999; display:flex; justify-content:center; align-items:center; border:3px solid var(--scp-red); box-sizing:border-box; }
        .auth-card { background:var(--panel-bg); border:1px solid var(--border); padding:30px; border-radius:12px; text-align:center; max-width:340px; width:88%; box-shadow:0 0 30px rgba(255,34,34,0.15); }
        .auth-input { background:#020305; border:1px solid var(--border); color:var(--neon-cyan); padding:14px; font-family:monospace; width:90%; font-size:15px; border-radius:8px; margin:8px 0; outline:none; box-sizing:border-box; transition:0.3s; }
        .auth-input:focus { border-color:var(--scp-red); box-shadow:0 0 10px rgba(255,34,34,0.2); }
        .btn-row { display:flex; gap:10px; margin-top:15px; }
        .auth-btn { flex:1; background:var(--scp-red); color:#fff; border:none; padding:14px; font-size:13px; font-weight:bold; letter-spacing:1px; border-radius:8px; cursor:pointer; font-family:monospace; transform:scale(1); transition:0.2s; }
        .auth-btn:active { transform:scale(0.96); }
        .auth-btn.alt { background:#141b26; border:1px solid var(--border); color:var(--neon-cyan); }

        /* GRID CHASSIS WITH INTEGRATED KINETIC ANIMATIONS */
        .app-shell { display:flex; width:100vw; height:100vh; position:relative; }
        .nav-sidebar { width:320px; background:var(--panel-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; box-sizing:border-box; transition:transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .panel-section { padding:15px; border-bottom:1px solid var(--border); overflow-y:auto; }
        .section-title { font-size:11px; font-weight:bold; color:var(--scp-red); margin-bottom:8px; font-family:monospace; letter-spacing:1px; display:flex; justify-content:space-between; align-items:center; }
        
        /* PHONEBOOK REGISTERED SELECTION CHIPS */
        .list-item { padding:12px; background:#040609; border:1px solid var(--border); border-radius:8px; margin:6px 0; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center; transition:0.3s cubic-bezier(0.2,0.8,0.2,1); }
        .list-item:hover, .list-item.active { border-color:var(--neon-cyan); background:#0c131d; box-shadow:0 0 12px rgba(0,255,204,0.1); }
        .select-checkbox { width:16px; height:16px; border:1px solid var(--border); accent-color:var(--scp-red); cursor:pointer; }
        
        /* ADAPTIVE CHAT SPACE WHATSAPP FRAMEWORK */
        .chat-space { flex:1; display:flex; flex-direction:column; background:#030406; height:100%; position:relative; box-sizing:border-box; }
        .chat-topbar { background:var(--panel-bg); padding:16px 20px; border-bottom:1px solid var(--border); font-family:monospace; font-weight:bold; color:var(--scp-red); display:flex; align-items:center; justify-content:space-between; z-index:20; }
        
        /* MOBILE VIEWPORT FIXED BOX PADDING CLIPPING SAFETY */
        .chat-feed { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; box-sizing:border-box; height:calc(100vh - 140px); width:100%; padding-bottom:85px; -webkit-overflow-scrolling:touch; }
        .row-pack { display:flex; width:100%; margin:2px 0; }
        .row-pack.me { justify-content:flex-end; }
        .row-pack.them { justify-content:flex-start; }
        
        /* HIGH-SPEED GLOW POP WHATSAPP BUBBLE */
        .bubble { max-width:75%; padding:11px 14px; border-radius:10px; font-size:14.5px; line-height:1.45; position:relative; animation:bubblePop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; opacity:0; transform:translateY(12px) scale(0.95); box-shadow:0 2px 5px rgba(0,0,0,0.4); }
        @keyframes bubblePop { to { opacity:1; transform:translateY(0) scale(1); } }
        .row-pack.me .bubble { background:var(--bubble-me); border:1px solid rgba(0,255,204,0.15); border-top-right-radius:0; color:#fff; }
        .row-pack.them .bubble { background:var(--bubble-them); border:1px solid var(--border); border-top-left-radius:0; }
        .meta-time { font-size:9px; color:#526284; display:block; text-align:right; margin-top:5px; font-family:sans-serif; }
        .tag-user { font-size:11px; font-weight:bold; color:var(--scp-red); font-family:monospace; display:block; margin-bottom:3px; }
        
        /* BOTTOM INPUT PACK CONTAINER SAFE BOUNDS BAR */
        .bottom-bar { position:absolute; bottom:0; left:0; width:100%; background:var(--panel-bg); padding:14px 16px; border-top:1px solid var(--border); display:flex; gap:12px; align-items:center; box-sizing:border-box; z-index:30; padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
        .chat-input { flex:1; background:#020305; border:1px solid var(--border); color:#fff; padding:14px; border-radius:10px; font-size:15px; outline:none; transition:0.2s; -webkit-appearance:none; }
        .chat-input:focus { border-color:var(--neon-cyan); background:#04060a; }
        .transmit-btn { background:#121a24; border:1px solid var(--neon-cyan); color:var(--neon-cyan); padding:14px 24px; font-size:13px; font-weight:bold; cursor:pointer; border-radius:10px; font-family:monospace; transition:0.2s; }
        .transmit-btn:hover { background:var(--neon-cyan); color:#000; box-shadow:0 0 12px var(--neon-cyan); }
        
        /* RESPONSIVE FLUID VIEWPORT ENGINE */
        @media (max-width: 768px) {
            .nav-sidebar { width:100%; position:absolute; left:0; top:0; height:100%; z-index:100; transform:translateX(0); }
            .nav-sidebar.hidden { transform:translateX(-100%); }
            .chat-space { width:100%; position:absolute; left:0; top:0; height:100%; }
            .bubble { max-width:85%; }
        }
    </style>
</head>
<body>
    <div id="auth-panel">
        <div class="auth-card">
            <svg width="50" height="50" viewBox="0 0 100 100" style="margin-bottom:10px; animation:spin 4s infinite linear;">
                <circle cx="50" cy="50" r="40" stroke="#ff2222" stroke-width="4" fill="none" />
                <line x1="50" y1="10" x2="50" y2="40" stroke="#ff2222" stroke-width="6" />
            </svg>
            <div style="color:var(--scp-red); font-weight:bold; font-family:monospace; font-size:16px; margin-bottom:15px;">■ OPERATOR SYSTEM AUTH</div>
            <input type="text" id="uid" class="auth-input" placeholder="OPERATOR ACCOUNT HANDLE">
            <input type="password" id="pwd" class="auth-input" placeholder="SECURITY DECRYPT CIPHER">
            <div class="btn-row">
                <button onclick="access(true)" class="auth-btn">REGISTER</button>
                <button onclick="access(false)" class="auth-btn alt">LOGIN</button>
            </div>
        </div>
    </div>

    <div class="app-shell">
        <div class="nav-sidebar" id="sidebar-ui">
            <div style="padding:16px; border-bottom:1px solid var(--border); font-family:monospace; font-weight:bold; color:var(--scp-red); display:flex; justify-content:space-between; align-items:center; background:#0c0f16;">
                <span>📡 INTRANET RADAR CHANNELS</span>
            </div>
            
            <div class="panel-section" style="max-height:160px;">
                <div class="section-title">ALL REGISTERED OPERATORS <span style="color:var(--neon-cyan); font-size:9px;">[PHONEBOOK AUTO-SYNC]</span></div>
                <div id="registered-directory" style="overflow-y:auto; max-height:110px;"></div>
            </div>
            
            <div class="panel-section" style="max-height:180px;">
                <div class="section-title">ACTIVE RECOGNIZED CONTACTS</div>
                <div id="contacts-list"></div>
            </div>
            
            <div class="panel-section" style="flex:1; border-bottom:none;">
                <div class="section-title">SECURE SECTOR GROUPS</div>
                <input type="text" id="group-name-box" class="auth-input" placeholder="ENTER NEW GROUP DESIGNATION" style="padding:8px; font-size:12px; margin-bottom:6px; width:100%; box-sizing:border-box;">
                <button onclick="triggerGroupCreation()" class="auth-btn alt" style="padding:8px; width:100%; font-size:11px; margin-bottom:8px;">BUILD GROUP FROM SELECTIONS</button>
                <div id="groups-list" style="overflow-y:auto; max-height:160px;"></div>
            </div>
        </div>

        <div class="chat-space" id="chat-ui">
            <div class="chat-topbar">
                <button onclick="toggleMobileView(true)" style="background:#131924; border:1px solid var(--border); color:var(--neon-cyan); padding:8px 14px; border-radius:6px; font-family:monospace; cursor:pointer; font-size:12px; font-weight:bold;">◀ MENU</button>
                <span id="target-title" style="font-size:13px; text-align:center; flex:1; padding:0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">SELECT TACTICAL TARGET DATALINK</span>
                <span style="font-size:10px; color:var(--neon-cyan); font-family:monospace;" id="pwa-status">PWA READY</span>
            </div>
            <div class="chat-feed" id="chat-frame"></div>
            <div class="bottom-bar">
                <input type="text" id="msg-box" class="chat-input" placeholder="Type tactical encrypted data packet..." disabled>
                <button onclick="sendPacket()" class="transmit-btn" id="msg-btn" disabled>TRANSMIT</button>
            </div>
        </div>
    </div>
    <script>
        let myUser = "", currentTarget = "", isGroupTarget = false, selectedMembers = [];
        
        async function access(isRegister) {
            let user = document.getElementById("uid").value.trim().toUpperCase();
            let pass = document.getElementById("pwd").value.trim();
            if(!user || !pass) return;
            
            let url = isRegister ? '/api/register' : '/api/login';
            let res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:user, password:pass}) });
            let data = await res.json();
            
            if(data.status === "SUCCESS") {
                myUser = user;
                document.getElementById("auth-panel").style.display = "none";
                toggleMobileView(true);
                initHub();
            } else { alert("ACCESS CLEARANCE EXCEPTION: " + data.status); }
        }

        function initHub() {
            syncCoreDirectories();
            setInterval(() => { if(currentTarget) syncMessages(); }, 1000);
            setInterval(syncCoreDirectories, 4000);
        }

        async function syncCoreDirectories() {
            try {
                let uRes = await fetch('/api/users'); let users = await uRes.json();
                let cRes = await fetch(`/api/contacts/${myUser}`); let contacts = await cRes.json();
                let gRes = await fetch(`/api/groups/${myUser}`); let groups = await gRes.json();
                
                let dirBox = document.getElementById("registered-directory"); dirBox.innerHTML = "";
                users.forEach(u => {
                    if(u !== myUser && !contacts.includes(u)) {
                        dirBox.innerHTML += `<div class="list-item"><span>${u}</span><button onclick="addContact('${u}')" style="background:var(--scp-red); color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">+ ADD</button></div>`;
                    }
                });

                let conBox = document.getElementById("contacts-list"); conBox.innerHTML = "";
                contacts.forEach(c => {
                    let isSel = selectedMembers.includes(c);
                    conBox.innerHTML += `<div class="list-item ${currentTarget===c && !isGroupTarget ? 'active':''}" onclick="handleSelectionClick('${c}', event)"><span>👤 ${c}</span><input type="checkbox" class="select-checkbox" ${isSel?'checked':''} onclick="event.stopPropagation(); toggleMemberSelection('${c}')"></div>`;
                });

                let grpBox = document.getElementById("groups-list"); grpBox.innerHTML = "";
                groups.forEach(g => {
                    grpBox.innerHTML += `<div class="list-item ${currentTarget===g && isGroupTarget ? 'active':''}" onclick="setTarget('${g}', true)"><span>📡 [GROUP] ${g}</span></div>`;
                });
            } catch(e){}
        }

        function handleSelectionClick(name, event) {
            if(event.target.type === 'checkbox') return;
            setTarget(name, false);
        }

        function toggleMemberSelection(name) {
            let idx = selectedMembers.indexOf(name);
            if(idx > -1) selectedMembers.splice(idx, 1);
            else selectedMembers.push(name);
        }

        async function addContact(target) {
            await fetch('/api/contacts/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:myUser, target:target}) });
            syncCoreDirectories();
        }

        async function triggerGroupCreation() {
            let gName = document.getElementById("group-name-box").value.trim().toUpperCase();
            if(!gName) { alert("ENTER UNIQUE GROUP DESIGNATION TARGET"); return; }
            if(selectedMembers.length === 0) { alert("CHECK AT LEAST ONE REGISTERED OPERATOR CHIP"); return; }
            
            let createRes = await fetch('/api/groups/create', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({group_name:gName, creator:myUser, members:selectedMembers}) });
            let data = await createRes.json();
            if(data.status === "SUCCESS") {
                document.getElementById("group-name-box").value = ""; selectedMembers = []; syncCoreDirectories();
            } else { alert(data.status); }
        }

        function setTarget(name, isGroup) {
            currentTarget = name; isGroupTarget = isGroup;
            document.getElementById("target-title").innerText = isGroup ? `[GROUP] ${name}` : `[DM] ${name}`;
            document.getElementById("msg-box").disabled = false;
            document.getElementById("msg-btn").disabled = false;
            toggleMobileView(false);
            syncMessages();
        }

        async function syncMessages() {
            let res = await fetch(`/api/messages/fetch?sender=${myUser}&target=${currentTarget}&is_group=${isGroupTarget}`);
            let messages = await res.json();
            let frame = document.getElementById("chat-frame");
            let scrollGuard = frame.scrollTop + frame.clientHeight >= frame.scrollHeight - 120;
            frame.innerHTML = "";
            
            messages.forEach(m => {
                let isMe = m.sender === myUser;
                let wrap = document.createElement("div"); wrap.className = `row-pack ${isMe ? 'me' : 'them'}`;
                wrap.innerHTML = `<div class="bubble">${!isMe && isGroupTarget ? `<span class="tag-user">${m.sender}</span>`:'' }<div>${m.text}</div><span class="meta-time">${m.time}</span></div>`;
                frame.appendChild(wrap);
            });
            if(scrollGuard) frame.scrollTop = frame.scrollHeight;
        }

        async function sendPacket() {
            let box = document.getElementById("msg-box"); let text = box.value.trim(); if(!text) return; box.value = "";
            await fetch('/api/messages/transmit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sender:myUser, target:currentTarget, text:text, is_group:isGroupTarget}) });
            syncMessages();
        }

        function toggleMobileView(showSidebar) {
            if(showSidebar) {
                document.getElementById("sidebar-ui").classList.remove("hidden");
            } else {
                document.getElementById("sidebar-ui").classList.add("hidden");
            }
        }
        document.getElementById("msg-box").addEventListener("keypress", (e) => { if(e.key === "Enter") sendPacket(); });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript,self.addEventListener(%22fetch%22,e=%3Ee);').catch(()=>{});
            });
        }
    </script>
</body>
</html>
