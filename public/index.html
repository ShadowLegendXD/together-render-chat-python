<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Secure Com-Hub Client</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://socket.io"></script>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* === THEME VISIBILITY ADJUSTMENTS === */
        body.theme-scp { background-color: #0b0f12; font-family: 'Share Tech Mono', monospace; color: #10b981; }
        .panel-scp { background-color: #111827; border: 2px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .input-scp { background-color: #1f2937; border: 1px solid #10b981; color: #34d399; }
        .text-scp-bright { color: #34d399 !format; }
        .bubble-me-scp { background-color: #065f46; color: #ffffff; border: 1px solid #34d399; border-radius: 12px 12px 0px 12px; }
        .bubble-them-scp { background-color: #374151; color: #ffffff; border: 1px solid #6b7280; border-radius: 12px 12px 12px 0px; }

        body.theme-minecraft { background-color: #3e2f23; font-family: 'VT323', monospace; color: #ffffff; font-size: 1.4rem; }
        .panel-minecraft { background-color: #2b1f14; border: 4px solid #5c4033; }
        .input-minecraft { background-color: #4a3525; border: 2px solid #ffffff; color: #ffffff; }
        .bubble-me-minecraft { background-color: #4a7227; color: #ffffff; border: 2px solid #ffffff; }
        .bubble-them-minecraft { background-color: #5a5a5a; color: #ffffff; border: 2px solid #d1d1d1; }

        body.theme-combined { background-color: #090d16; font-family: 'Share Tech Mono', monospace; color: #38bdf8; }
        .panel-combined { background-color: #1e1b4b; border: 2px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); }
        .input-combined { background-color: #312e81; border: 1px solid #38bdf8; color: #f43f5e; }
        .bubble-me-combined { background-color: #9f1239; color: #ffffff; border: 1px solid #f43f5e; }
        .bubble-them-combined { background-color: #0369a1; color: #ffffff; border: 1px solid #38bdf8; }

        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #34d399; border-radius: 4px; }
        .pulse-mic { animation: recordFlash 1s infinite alternate; }
        @keyframes recordFlash { 0% { box-shadow: 0 0 0px transparent; } 100% { box-shadow: 0 0 15px #ef4444; background-color: #ef4444; } }
    </style>
</head>
<body class="theme-scp h-screen w-screen flex items-center justify-center p-3">

    <!-- SIGN-IN AND REGISTRATION PANEL -->
    <div id="auth-screen" class="w-full max-w-md bg-slate-900 p-8 rounded-lg border-2 border-emerald-400 shadow-[0_0_30px_rgba(16,185,129,0.5)] animate__animated animate__zoomIn">
        <h1 class="text-center text-2xl font-black tracking-widest text-emerald-400 mb-6 uppercase">TACTICAL COMM CORE</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] text-emerald-400 font-bold mb-1">OPERATOR CODENAME</label>
                <input type="text" id="username" placeholder="ENTER CODENAME" class="w-full bg-black border-2 border-emerald-500 p-3 text-white font-mono text-sm focus:outline-none focus:border-emerald-400 rounded">
            </div>
            <div>
                <label class="block text-[10px] text-emerald-400 font-bold mb-1">SECURITY ACCESS KEY</label>
                <input type="password" id="password" placeholder="ENTER SECURITY KEY" class="w-full bg-black border-2 border-emerald-500 p-3 text-white font-mono text-sm focus:outline-none focus:border-emerald-400 rounded">
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="handleAuth('/api/login')" class="flex-1 bg-emerald-600 border-2 border-emerald-400 text-white font-bold py-3 text-xs uppercase tracking-wider hover:bg-emerald-400 hover:text-black transition rounded">LOGIN TERMINAL</button>
                <button onclick="handleAuth('/api/register')" class="flex-1 bg-zinc-800 border-2 border-zinc-600 text-zinc-200 py-3 text-xs uppercase tracking-wider hover:bg-zinc-700 hover:text-white transition rounded">REGISTER</button>
            </div>
        </div>
    </div>

    <!-- MAIN INTERFACE CHAT LOG STREAM -->
    <div id="chat-screen" class="hidden w-full h-[94vh] max-w-7xl rounded-lg flex overflow-hidden shadow-2xl transition-all duration-300">
        
        <!-- SIDEBAR LEFT: CONTACTS ARCHIVE PANEL -->
        <div id="left-panel" class="w-80 border-r-2 border-white/20 flex flex-col justify-between panel-scp">
            <div class="flex flex-col h-full">
                <div class="p-4 border-b border-white/20 flex items-center justify-between bg-black/40">
                    <span id="user-display" class="font-black text-xs text-white tracking-widest uppercase"></span>
                    <button onclick="logout()" class="text-[10px] text-white border-2 border-red-500 bg-red-600 px-2 py-1 rounded font-bold transition hover:bg-red-400">LOGOUT</button>
                </div>

                <div class="p-3 border-b border-white/20 bg-black/20">
                    <label class="block text-[10px] text-white mb-1.5 font-bold uppercase tracking-wider">🎨 CLIENT VISUAL THEME MATRIX</label>
                    <select id="theme-selector" onchange="swapActiveTheme(this.value)" class="w-full bg-black border-2 border-white/40 text-white p-2.5 text-xs rounded font-mono font-bold focus:outline-none">
                        <option value="scp text-emerald-400">SCP Foundation Terminal Core</option>
                        <option value="minecraft text-orange-400">Minecraft Block Crafting Grid</option>
                        <option value="combined text-sky-400">Combined Cyber-Anomalous Matrix</option>
                    </select>
                </div>

                <!-- WHATSAPP PROTOCOL: CONTACT MANAGER ADD ACTION WORKFLOW -->
                <div class="p-3 border-b border-white/20 bg-black/30 space-y-2">
                    <div class="text-[10px] text-white font-bold uppercase">⚡ Quick Add Target Contact</div>
                    <div class="flex gap-1.5">
                        <input type="text" id="new-contact-name" placeholder="Target Codename..." class="flex-1 bg-black border border-white/40 p-1.5 text-xs text-white focus:outline-none rounded">
                        <button onclick="addUserContact()" class="bg-emerald-600 text-white px-3 text-xs font-bold rounded hover:bg-emerald-400 transition">+</button>
                    </div>
                </div>

                <!-- CONTACTS LIST ARCHIVE FEED CONTAINER -->
                <div class="flex-1 overflow-y-auto p-2 space-y-2 terminal-scroll bg-black/20">
                    <div class="text-[10px] text-white/60 font-bold uppercase tracking-wider px-2">Contacts List Directory</div>
                    <div id="contacts-list" class="space-y-1"></div>
                    
                    <div class="text-[10px] text-white/60 font-bold uppercase tracking-wider px-2 pt-2 border-t border-white/10">All Registered Network Accounts</div>
                    <div id="accounts-list" class="space-y-1 text-xs px-2 text-white/80 font-mono"></div>
                </div>
            </div>
        </div>
        <!-- RIGHT PANEL: CONVERSATIONAL STREAM WORKSPACE FEED -->
        <div class="flex-1 flex flex-col h-full bg-black/60 relative">
            <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-4 terminal-scroll bg-[radial-gradient(rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:24px_24px]"></div>

            <div class="p-4 border-t-2 border-white/20 bg-zinc-900 flex items-center gap-3">
                <input type="text" id="message-input" placeholder="Type encryption terminal message packets..." class="flex-1 bg-black border-2 border-white/40 text-white rounded-lg p-3.5 text-xs font-bold focus:outline-none focus:border-white font-mono">
                
                <button id="voice-btn" onclick="toggleVoiceRecord()" class="bg-black border-2 border-white/40 text-white p-3.5 rounded-lg hover:bg-white hover:text-black transition flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendText()" class="bg-emerald-600 text-white border-2 border-emerald-400 px-6 py-3.5 rounded-lg text-xs font-black uppercase tracking-widest hover:bg-emerald-400 hover:text-black transition duration-200">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') 
            ? 'http://127.0.0.1:8000' 
            : window.location.origin;
            
        let socket, mediaRecorder, audioChunks = [], isRecording = false, currentUser = "", currentTheme = "scp";

        window.addEventListener('load', async () => {
            const savedToken = localStorage.getItem('scp_session_token');
            if (savedToken) {
                try {
                    const response = await fetch(`${BACKEND_URL}/api/verify`, {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    });
                    const data = await response.json();
                    if (data.success) {
                        currentUser = data.username;
                        currentTheme = data.theme;
                        launchSecureChat(data.username);
                    } else { localStorage.removeItem('scp_session_token'); }
                } catch (e) { console.error("Database connection failure context mapping."); }
            }
        });

        async function handleAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!username || !password) return alert("Validation values required.");

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(!res.ok) return alert(`ACCESS DENIED: ${data.detail || "Authentication Failed"}`);

                localStorage.setItem('scp_session_token', data.token);
                currentUser = data.username;
                currentTheme = data.theme || "scp";
                launchSecureChat(data.username);
            } catch(e) { alert("Core pipeline connection exception mapped."); }
        }
        function launchSecureChat(username) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = username.toUpperCase();
            
            applyThemeClasses(currentTheme);
            document.getElementById('theme-selector').value = currentTheme;

            socket = io(BACKEND_URL, { path: "/socket.io" });
            socket.emit('join', username);
            socket.on('receiveMessage', (msg) => { renderIncomingMessage(msg); });

            syncNetworkUserDirectories();
        }

        async function syncNetworkUserDirectories() {
            const token = localStorage.getItem('scp_session_token');
            try {
                const resContacts = await fetch(`${BACKEND_URL}/api/contacts`, { headers: {'Authorization': `Bearer ${token}`} });
                const dContacts = await resContacts.json();
                const container = document.getElementById('contacts-list');
                container.innerHTML = "";
                dContacts.contacts.forEach(c => {
                    container.innerHTML += `
                        <div class="p-2.5 bg-white/10 rounded border border-white/10 flex justify-between items-center text-xs font-mono font-bold text-white hover:bg-white/20 transition">
                            <span>👤 ${c.toUpperCase()}</span>
                            <span class="text-[9px] text-emerald-400">CONNECTED</span>
                        </div>`;
                });
            } catch(e){}

            try {
                const resAccounts = await fetch(`${BACKEND_URL}/api/accounts`);
                const dAccounts = await resAccounts.json();
                const container = document.getElementById('accounts-list');
                container.innerHTML = "";
                dAccounts.accounts.forEach(a => {
                    container.innerHTML += `<div class="py-0.5 border-b border-white/5 flex justify-between"><span>● ${a}</span> <button onclick="addDirectAccount('${a}')" class="text-[9px] text-emerald-400 hover:underline">[+ Add]</button></div>`;
                });
            } catch(e){}
        }

        async function addUserContact() {
            const name = document.getElementById('new-contact-name').value.trim();
            if(!name) return;
            await addDirectAccount(name);
            document.getElementById('new-contact-name').value = "";
        }

        async function addDirectAccount(targetName) {
            const token = localStorage.getItem('scp_session_token');
            const res = await fetch(`${BACKEND_URL}/api/contacts/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ contact_name: targetName })
            });
            if(res.ok) syncNetworkUserDirectories();
            else alert("Cannot index target user validation routing profile.");
        }

        async function swapActiveTheme(newTheme) {
            currentTheme = newTheme;
            applyThemeClasses(newTheme);
            const token = localStorage.getItem('scp_session_token');
            if(token) {
                await fetch(`${BACKEND_URL}/api/theme`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ theme: newTheme })
                });
            }
        }

        function applyThemeClasses(theme) {
            document.body.className = `theme-${theme}`;
            const leftPanel = document.getElementById('left-panel');
            leftPanel.className = `w-80 border-r-2 border-white/20 flex flex-col justify-between panel-${theme}`;
        }

        function logout() {
            localStorage.removeItem('scp_session_token');
            window.location.reload();
        }

        function sendText() {
            const input = document.getElementById('message-input');
            if(!input.value.trim()) return;
            socket.emit('sendMessage', { text: input.value });
            input.value = '';
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('voice-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => { socket.emit('sendMessage', { voice: reader.result }); };
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('pulse-mic');
                } catch (err) { alert("Microphone clearance fault."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('pulse-mic');
            }
        }

        function renderIncomingMessage(msg) {
            const container = document.getElementById('messages-container');
            const item = document.createElement('div');
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            item.className = `w-full flex ${isMe ? 'justify-end' : 'justify-start'}`;
            const bubbleClass = isMe ? `bubble-me-${currentTheme}` : `bubble-them-${currentTheme}`;
            
            let messageContent = "";
            if (msg.text) {
                messageContent = `<p class="text-sm font-sans tracking-wide leading-relaxed font-bold select-all">${msg.text}</p>`;
            } else if (msg.voice) {
                messageContent = `<audio controls src="${msg.voice}" class="w-64 mt-1 h-8 rounded bg-white/20"></audio>`;
            }

            item.innerHTML = `
                <div class="${bubbleClass} p-3.5 max-w-md shadow-lg animate__animated animate__fadeInUp relative">
                    <div class="flex justify-between items-center gap-6 text-[10px] text-white/80 font-black mb-1.5 uppercase font-mono tracking-wider">
                        <span>${msg.sender}</span>
                        <span>${msg.timestamp}</span>
                    </div>
                    ${messageContent}
                </div>
            `;
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
