<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCP Tactical Network Console</title>
    <style>
        :root {
            --bg-main: #040508; --panel-bg: #090c12; --scp-red: #ff2222;
            --neon-cyan: #00ffcc; --border: #141a24; --bubble-me: #152232; --bubble-them: #0d1017;
        }
        body, html { margin:0; padding:0; width:100%; height:100%; background:var(--bg-main); color:#f8f8f2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
        
        #auth-panel { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-main); z-index:9999; display:flex; justify-content:center; align-items:center; border:3px solid var(--scp-red); box-sizing:border-box; }
        .auth-card { background:var(--panel-bg); border:1px solid var(--border); padding:30px; border-radius:12px; text-align:center; max-width:340px; width:88%; box-shadow:0 0 30px rgba(255,34,34,0.15); }
        .auth-input { background:#020305; border:1px solid var(--scp-red); color:var(--neon-cyan); padding:12px; font-family:monospace; width:85%; font-size:15px; border-radius:6px; margin:8px 0; text-align:center; outline:none; }
        .btn-row { display:flex; gap:10px; margin-top:15px; }
        .auth-btn { flex:1; background:var(--scp-red); color:#fff; border:none; padding:12px; font-size:12px; font-weight:bold; letter-spacing:1px; border-radius:6px; cursor:pointer; font-family:monospace; }
        .auth-btn.alt { background:#141b26; border:1px solid var(--border); color:var(--neon-cyan); }

        .app-shell { display:flex; width:100vw; height:100vh; }
        .nav-sidebar { width:300px; background:var(--panel-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; box-sizing:border-box; }
        .panel-section { padding:15px; border-bottom:1px solid var(--border); overflow-y:auto; max-height:220px; }
        .section-title { font-size:11px; font-weight:bold; color:var(--scp-red); margin-bottom:8px; font-family:monospace; letter-spacing:1px; }
        
        .list-item { padding:10px; background:#040609; border:1px solid var(--border); border-radius:6px; margin:5px 0; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; align-items:center; transition:0.2s; }
        .list-item:hover, .list-item.active { border-color:var(--neon-cyan); background:#0c121c; }
        
        .chat-space { flex:1; display:flex; flex-direction:column; background:#030406; height:100%; position:relative; }
        .chat-topbar { background:var(--panel-bg); padding:15px; border-bottom:1px solid var(--border); font-family:monospace; font-weight:bold; color:var(--scp-red); }
        .chat-feed { flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; box-sizing:border-box; margin-bottom:70px; }
        
        .row-pack { display:flex; width:100%; }
        .row-pack.me { justify-content:flex-end; }
        .row-pack.them { justify-content:flex-start; }
        .bubble { max-width:70%; padding:10px 12px; border-radius:8px; font-size:14px; line-height:1.4; position:relative; transform:translateY(0); animation:popGlow 0.25s ease-out; }
        @keyframes popGlow { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
        .row-pack.me .bubble { background:var(--bubble-me); border:1px solid rgba(0,255,204,0.15); border-top-right-radius:0; }
        .row-pack.them .bubble { background:var(--bubble-them); border:1px solid var(--border); border-top-left-radius:0; }
        .meta-time { font-size:9px; color:#526284; display:block; text-align:right; margin-top:4px; }
        .tag-user { font-size:11px; font-weight:bold; color:var(--scp-red); font-family:monospace; display:block; margin-bottom:2px; }
        
        .bottom-bar { position:absolute; bottom:0; left:0; width:100%; background:var(--panel-bg); padding:12px 15px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; box-sizing:border-box; }
        .chat-input { flex:1; background:#020305; border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px; font-size:14px; outline:none; }
        .transmit-btn { background:#121a24; border:1px solid var(--neon-cyan); color:var(--neon-cyan); padding:12px 22px; font-size:12px; font-weight:bold; cursor:pointer; border-radius:8px; font-family:monospace; }
        
        @media (max-width: 768px) {
            .nav-sidebar { width:100%; position:fixed; z-index:50; height:100%; display:block; }
            .nav-sidebar.hidden { display:none; }
            .chat-space { display:flex; }
            .chat-space.hidden { display:none; }
        }
    </style>
</head>
<body>
    <div id="auth-panel">
        <div class="auth-card">
            <svg width="50" height="50" viewBox="0 0 100 100" style="margin-bottom:10px;">
                <circle cx="50" cy="50" r="40" stroke="#ff2222" stroke-width="4" fill="none" />
                <line x1="50" y1="10" x2="50" y2="40" stroke="#ff2222" stroke-width="6" />
            </svg>
            <div style="color:var(--scp-red); font-weight:bold; font-family:monospace; font-size:16px; margin-bottom:15px;">■ INTRANET DATABASE AUTH</div>
            <input type="text" id="uid" class="auth-input" placeholder="OPERATOR ID">
            <input type="password" id="pwd" class="auth-input" placeholder="ACCESS CIPHER">
            <div class="btn-row">
                <button onclick="access(true)" class="auth-btn">REGISTER</button>
                <button onclick="access(false)" class="auth-btn alt">LOGIN</button>
            </div>
        </div>
    </div>

    <div class="app-shell">
        <div class="nav-sidebar" id="sidebar-ui">
            <div style="padding:15px; border-bottom:1px solid var(--border); font-family:monospace; font-weight:bold; color:var(--scp-red); display:flex; justify-content:space-between;">
                <span>FOUNDATION LINK</span>
                <button onclick="toggleMobileView(false)" style="display:none;" id="mobile-close-btn">✖</button>
            </div>
            
            <div class="panel-section">
                <div class="section-title">[OPERATOR SEARCH]</div>
                <input type="text" id="search-box" class="auth-input" placeholder="Search accounts..." style="width:90%; padding:6px; font-size:12px;" onkeyup="searchAccounts()">
                <div id="search-results" style="margin-top:5px;"></div>
            </div>
            
            <div class="panel-section">
                <div class="section-title">[CONTACTS]</div>
                <div id="contacts-list"></div>
            </div>
            
            <div class="panel-section" style="flex:1;">
                <div class="section-title">[TACTICAL GROUPS]</div>
                <input type="text" id="group-name-box" class="auth-input" placeholder="New Group Name" style="width:90%; padding:6px; font-size:12px; margin-bottom:5px;">
                <button onclick="triggerGroupCreation()" class="auth-btn alt" style="padding:6px; width:96%; font-size:11px; margin-bottom:8px;">CREATE GROUP WITH CONTACTS</button>
                <div id="groups-list"></div>
            </div>
        </div>

        <div class="chat-space hidden" id="chat-ui">
            <div class="chat-topbar" style="display:flex; justify-content:space-between;">
                <span id="target-title">SELECT OPERATOR / GROUP LINK</span>
                <button onclick="toggleMobileView(true)" style="background:none; border:1px solid var(--border); color:var(--neon-cyan); padding:4px 8px; border-radius:4px; font-family:monospace; cursor:pointer;">PANEL</button>
            </div>
            <div class="chat-feed" id="chat-frame"></div>
            <div class="bottom-bar">
                <input type="text" id="msg-box" class="chat-input" placeholder="Type tactical message packet...">
                <button onclick="sendPacket()" class="transmit-btn" id="msg-btn">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script>
        let myUser = "", currentTarget = "", isGroupTarget = false;
        
        async function access(isRegister) {
            let user = document.getElementById("uid").value.trim();
            let pass = document.getElementById("pwd").value.trim();
            if(!user || !pass) return;
            
            let url = isRegister ? '/api/register' : '/api/login';
            let res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:user, password:pass}) });
            let data = await res.json();
            
            if(data.status === "SUCCESS") {
                myUser = user.toUpperCase();
                document.getElementById("auth-panel").style.display = "none";
                if(window.innerWidth <= 768) toggleMobileView(true);
                initHub();
            } else { alert("ACCESS CLEARANCE EXCEPTION: " + data.status); }
        }

        function initHub() {
            loadContacts(); loadGroups();
            setInterval(() => { if(currentTarget) syncMessages(); }, 1200);
            setInterval(() => { loadContacts(); loadGroups(); }, 5000);
        }

        async function searchAccounts() {
            let query = document.getElementById("search-box").value.toUpperCase().trim();
            if(!query) { document.getElementById("search-results").innerHTML = ""; return; }
            let res = await fetch('/api/users'); let users = await res.json();
            let box = document.getElementById("search-results"); box.innerHTML = "";
            
            users.forEach(u => {
                if(u.includes(query) && u !== myUser) {
                    box.innerHTML += `<div class="list-item"><span>${u}</span><button onclick="addContact('${u}')" style="background:var(--scp-red); color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">+ CONTACT</button></div>`;
                }
            });
        }

        async function addContact(target) {
            await fetch('/api/contacts/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:myUser, target:target}) });
            loadContacts(); document.getElementById("search-box").value = ""; document.getElementById("search-results").innerHTML = "";
        }

        async function loadContacts() {
            let res = await fetch(`/api/contacts/${myUser}`); let contacts = await res.json();
            let box = document.getElementById("contacts-list"); box.innerHTML = "";
            contacts.forEach(c => {
                box.innerHTML += `<div class="list-item ${currentTarget===c && !isGroupTarget ? 'active':''}" onclick="setTarget('${c}', false)"><span>● ${c}</span></div>`;
            });
        }

        async function triggerGroupCreation() {
            let gName = document.getElementById("group-name-box").value.trim(); if(!gName) return;
            let res = await fetch(`/api/contacts/${myUser}`); let contacts = await res.json();
            if(contacts.length === 0) { alert("Group builds require at least 1 contact entry."); return; }
            
            let createRes = await fetch('/api/groups/create', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({group_name:gName, creator:myUser, members:contacts}) });
            let data = await createRes.json();
            if(data.status === "SUCCESS") { document.getElementById("group-name-box").value = ""; loadGroups(); } else { alert(data.status); }
        }

        async function loadGroups() {
            let res = await fetch(`/api/groups/${myUser}`); let groups = await res.json();
            let box = document.getElementById("groups-list"); box.innerHTML = "";
            groups.forEach(g => {
                box.innerHTML += `<div class="list-item ${currentTarget===g && isGroupTarget ? 'active':''}" onclick="setTarget('${g}', true)"><span>[GROUP] ${g}</span></div>`;
            });
        }

        function setTarget(name, isGroup) {
            currentTarget = name; isGroupTarget = isGroup;
            document.getElementById("target-title").innerText = isGroup ? `[GROUP PACKET LINK] : ${name}` : `[SECURE DM] : ${name}`;
            document.getElementById("msg-box").disabled = false;
            document.getElementById("msg-btn").disabled = false;
            if(window.innerWidth <= 768) toggleMobileView(false);
            syncMessages();
        }

        async function syncMessages() {
            let res = await fetch(`/api/messages/fetch?sender=${myUser}&target=${currentTarget}&is_group=${isGroupTarget}`);
            let messages = await res.json();
            let frame = document.getElementById("chat-frame");
            let scrollGuard = frame.scrollTop + frame.clientHeight >= frame.scrollHeight - 80;
            frame.innerHTML = "";
            
            messages.forEach(m => {
                let isMe = m.sender === myUser;
                let wrap = document.createElement("div"); wrap.className = `row-pack ${isMe ? 'me' : 'them'}`;
                wrap.innerHTML = `<div class="bubble">${!isMe && isGroupTarget ? `<span class="tag-user">${m.sender}</span>`:'' }<div>${m.text}</div><span class="meta-time">${m.time}</span></div>`;
                frame.appendChild(wrap);
            });
            if(scrollGuard) frame.scrollTop = frame.scrollHeight;
        }

        async function sendPacket() {
            let box = document.getElementById("msg-box"); let text = box.value.trim(); if(!text) return; box.value = "";
            await fetch('/api/messages/transmit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sender:myUser, target:currentTarget, text:text, is_group:isGroupTarget}) });
            syncMessages();
        }

        function toggleMobileView(showSidebar) {
            if(showSidebar) {
                document.getElementById("sidebar-ui").classList.remove("hidden");
                document.getElementById("chat-ui").classList.add("hidden");
            } else {
                document.getElementById("sidebar-ui").classList.add("hidden");
                document.getElementById("chat-ui").classList.remove("hidden");
            }
        }
        document.getElementById("msg-box").addEventListener("keypress", (e) => { if(e.key === "Enter") sendPacket(); });
    </script>
</body>
</html>
