<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Secure Com-Hub Client</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://socket.io"></script>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* === THEME MATRIX HIGH CONTRAST REBUILD === */
        /* SCP Terminal (Vivid Glow Green) */
        body.theme-scp { background-color: #030604; font-family: 'Share Tech Mono', monospace; color: #34d399; }
        .panel-scp { background-color: #09170f; border: 1px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .bubble-me-scp { background-color: #065f46; color: #ffffff; border: 1px solid #34d399; border-radius: 12px 12px 0px 12px; }
        .bubble-them-scp { background-color: #202024; color: #e4e4e7; border: 1px solid #52525b; border-radius: 12px 12px 12px 0px; }

        /* Minecraft Layout (Classic Bright Interface Text) */
        body.theme-minecraft { background-color: #4c3e31; font-family: 'VT323', monospace; color: #ffffff; font-size: 1.4rem; }
        .panel-minecraft { background-color: #2e2216; border: 4px solid #1a1108; }
        .bubble-me-minecraft { background-color: #4a7227; color: #ffffff; border: 2px solid #ffffff; border-radius: 4px; }
        .bubble-them-minecraft { background-color: #4a4a4a; color: #ffffff; border: 2px solid #a1a1a1; border-radius: 4px; }

        /* Combined Theme (High Density Neon Cyan & Pink) */
        body.theme-combined { background-color: #070a14; font-family: 'Share Tech Mono', monospace; color: #38bdf8; }
        .panel-combined { background-color: #0f172a; border: 1px dashed #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .bubble-me-combined { background-color: #9f1239; color: #ffffff; border: 1px solid #fda4af; border-radius: 16px 16px 4px 16px; }
        .bubble-them-combined { background-color: #0369a1; color: #ffffff; border: 1px solid #7dd3fc; border-radius: 16px 16px 16px 4px; }

        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #34d399; border-radius: 4px; }
        .pulse-mic { animation: recordFlash 1s infinite alternate; }
        @keyframes recordFlash { 0% { box-shadow: 0 0 0px transparent; } 100% { box-shadow: 0 0 15px #ef4444; background-color: #ef4444; } }
    </style>
</head>
<body class="theme-scp h-screen w-screen flex items-center justify-center p-3">

    <!-- SECURITY SIGN-IN SCREEN -->
    <div id="auth-screen" class="w-full max-w-md bg-zinc-950 p-8 rounded border border-emerald-500 shadow-[0_0_30px_rgba(16,185,129,0.3)] animate__animated animate__zoomIn">
        <h1 class="text-center text-xl font-bold tracking-widest text-emerald-400 mb-6 uppercase">Tactical Terminal Core</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="CODENAME ACCOUNT" class="w-full bg-black border border-emerald-500 p-3 text-emerald-300 placeholder-emerald-800 font-mono text-xs focus:outline-none focus:ring-1 focus:ring-emerald-400 rounded">
            <input type="password" id="password" placeholder="PASSPHRASE SECURITY KEY" class="w-full bg-black border border-emerald-500 p-3 text-emerald-300 placeholder-emerald-800 font-mono text-xs focus:outline-none focus:ring-1 focus:ring-emerald-400 rounded">
            <div class="flex gap-3 pt-2">
                <button onclick="handleAuth('/api/login')" class="flex-1 bg-emerald-900 border border-emerald-400 text-white py-3 text-xs uppercase tracking-wider font-bold hover:bg-emerald-500 hover:text-black transition rounded">Login</button>
                <button onclick="handleAuth('/api/register')" class="flex-1 bg-zinc-900 border border-zinc-600 text-zinc-300 py-3 text-xs uppercase tracking-wider hover:bg-zinc-700 hover:text-white transition rounded">Register</button>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT SCREEN INTERFACE -->
    <div id="chat-screen" class="hidden w-full h-[94vh] max-w-6xl rounded flex overflow-hidden shadow-2xl transition-all duration-300">
        
        <!-- SIDEBAR LEFT CONTROLLER PANEL -->
        <div id="left-panel" class="w-80 border-r border-white/20 flex flex-col justify-between bg-zinc-900">
            <div>
                <div class="p-4 border-b border-white/20 flex items-center justify-between bg-black/40">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
                        <span id="user-display" class="font-bold text-xs text-white uppercase tracking-wider"></span>
                    </div>
                    <button onclick="logout()" class="text-[10px] text-red-400 border border-red-500 px-2 py-0.5 rounded bg-red-950/40 hover:bg-red-500 hover:text-black transition font-bold uppercase">DISCONNECT</button>
                </div>

                <!-- READABLE DROPDOWN CONTROLS -->
                <div class="p-4 border-b border-white/20 bg-black/20">
                    <label class="block text-[10px] tracking-wider uppercase text-emerald-300 mb-1.5 font-black">🎨 SELECT CLIENT MATRIX SKIN</label>
                    <select id="theme-selector" onchange="swapActiveTheme(this.value)" class="w-full bg-zinc-950 border border-emerald-400 text-emerald-300 p-2.5 text-xs rounded font-mono font-bold focus:outline-none">
                        <option value="scp" class="bg-zinc-900 text-emerald-400">Aesthetic Alpha: SCP Terminal Secure Layout</option>
                        <option value="minecraft" class="bg-zinc-900 text-orange-400">Aesthetic Beta: Minecraft Recipe Grid</option>
                        <option value="combined" class="bg-zinc-900 text-sky-400">Aesthetic Gamma: Combined Anomalous Fusion</option>
                    </select>
                </div>

                <div class="p-2">
                    <div class="p-3 bg-emerald-950/40 rounded border border-emerald-500/40 flex items-center gap-3 cursor-pointer">
                        <div class="w-10 h-10 bg-emerald-500/20 rounded-full flex items-center justify-center font-bold text-sm">📡</div>
                        <div class="flex-1">
                            <div class="text-xs font-black tracking-wide text-white flex justify-between">[GLOBAL CORE STREAM] <span class="text-[9px] text-emerald-400 animate-pulse font-bold">LIVE</span></div>
                            <p class="text-[11px] text-emerald-300/80 truncate mt-0.5">Continuous synchronization active...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-3 bg-black border-t border-white/10 text-[9px] text-center text-zinc-500 font-mono tracking-widest font-bold">
                PERSISTENT ARCHIVE REPLICATOR ACTIVE
            </div>
        </div>
        <!-- CHAT WORKSPACE FEED PANEL -->
        <div class="flex-1 flex flex-col h-full bg-zinc-950/80 relative">
            <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-4 terminal-scroll bg-[radial-gradient(rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:20px_20px]"></div>

            <div class="p-4 border-t border-white/20 bg-zinc-900 flex items-center gap-3">
                <input type="text" id="message-input" placeholder="Type verified encrypted message packet..." class="flex-1 bg-black border border-emerald-500 text-white rounded-lg p-3.5 text-xs focus:outline-none focus:border-emerald-400 font-mono">
                
                <button id="voice-btn" onclick="toggleVoiceRecord()" class="bg-black border border-emerald-500 text-emerald-400 p-3.5 rounded-lg hover:bg-emerald-500 hover:text-black transition flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendText()" class="bg-emerald-600 text-white px-6 py-3.5 border border-emerald-400 rounded-lg text-xs font-black uppercase tracking-wider hover:bg-emerald-400 hover:text-black transition duration-200">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') 
            ? 'http://127.0.0.1:8000' 
            : window.location.origin;
            
        let socket, mediaRecorder, audioChunks = [], isRecording = false, currentUser = "", currentTheme = "scp";

        window.addEventListener('load', async () => {
            const savedToken = localStorage.getItem('scp_session_token');
            if (savedToken) {
                try {
                    const response = await fetch(`${BACKEND_URL}/api/verify`, {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    });
                    const data = await response.json();
                    if (data.success) {
                        currentUser = data.username;
                        currentTheme = data.theme;
                        launchSecureChat(data.username);
                    } else { localStorage.removeItem('scp_session_token'); }
                } catch (e) { console.error("Database Core Handshake trace missing."); }
            }
        });

        async function handleAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!username || !password) return alert("All parameters required.");

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(!res.ok) return alert(`ACCESS DENIED: ${data.detail || "Authentication Failed"}`);

                localStorage.setItem('scp_session_token', data.token);
                currentUser = data.username;
                currentTheme = data.theme || "scp";
                launchSecureChat(data.username);
            } catch(e) { alert("Core connection trace fault."); }
        }

        function launchSecureChat(username) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = username.toUpperCase();
            
            applyThemeClasses(currentTheme);
            document.getElementById('theme-selector').value = currentTheme;

            socket = io(BACKEND_URL, { path: "/socket.io" });
            socket.emit('join', username);
            socket.on('receiveMessage', (msg) => { renderIncomingMessage(msg); });
        }

        async function swapActiveTheme(newTheme) {
            currentTheme = newTheme;
            applyThemeClasses(newTheme);
            const token = localStorage.getItem('scp_session_token');
            if(token) {
                await fetch(`${BACKEND_URL}/api/theme`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ theme: newTheme })
                });
            }
        }

        function applyThemeClasses(theme) {
            document.body.className = `theme-${theme}`;
            const leftPanel = document.getElementById('left-panel');
            leftPanel.className = `w-80 border-r border-white/20 flex flex-col justify-between panel-${theme}`;
        }

        function logout() {
            localStorage.removeItem('scp_session_token');
            window.location.reload();
        }

        function sendText() {
            const input = document.getElementById('message-input');
            if(!input.value.trim()) return;
            socket.emit('sendMessage', { text: input.value });
            input.value = '';
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('voice-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => { socket.emit('sendMessage', { voice: reader.result }); };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('pulse-mic');
                } catch (err) { alert("Microphone clearance fault."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('pulse-mic');
            }
        }

        function renderIncomingMessage(msg) {
            const container = document.getElementById('messages-container');
            const item = document.createElement('div');
            
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            item.className = `w-full flex ${isMe ? 'justify-end' : 'justify-start'}`;

            const bubbleClass = isMe ? `bubble-me-${currentTheme}` : `bubble-them-${currentTheme}`;
            
            let messageContent = "";
            if (msg.text) {
                messageContent = `<p class="text-sm font-sans tracking-wide leading-relaxed font-bold select-all">${msg.text}</p>`;
            } else if (msg.voice) {
                messageContent = `<audio controls src="${msg.voice}" class="w-64 mt-1 h-8 rounded bg-white/20"></audio>`;
            }

            item.innerHTML = `
                <div class="${bubbleClass} p-3.5 max-w-md shadow-lg animate__animated animate__fadeInUp relative">
                    <div class="flex justify-between items-center gap-6 text-[10px] text-white/70 font-bold mb-1.5 uppercase font-mono">
                        <span>${msg.sender}</span>
                        <span>${msg.timestamp}</span>
                    </div>
                    ${messageContent}
                </div>
            `;
            
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
