<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Secure Com-Hub Client</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://socket.io"></script>
    <link rel="stylesheet" href="https://cloudflare.com"/>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* === THEME MATRIX SYSTEM === */
        /* SCP Foundation (Classified Cyberpunk Terminal) */
        body.theme-scp { background-color: #030604; font-family: 'Share Tech Mono', monospace; color: #10b981; }
        body.theme-scp ::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%); z-index: 99999; pointer-events: none; background-size: 100% 4px; opacity: 0.4; }
        .panel-scp { background-color: rgba(0, 5, 2, 0.85); border: 1px solid #064e3b; box-shadow: 0 0 15px rgba(16, 185, 129, 0.15); }
        .bubble-me-scp { background-color: #064e3b; color: #a7f3d0; border: 1px solid #10b981; border-radius: 12px 12px 0px 12px; }
        .bubble-them-scp { background-color: #1c1917; color: #d6d3d1; border: 1px solid #44403c; border-radius: 12px 12px 12px 0px; }

        /* Minecraft Layout (Pixel Art Block Engine style) */
        body.theme-minecraft { background-color: #4c3e31; font-family: 'VT323', monospace; color: #ffffff; font-size: 1.25rem; }
        .panel-minecraft { background-color: #2e2216; border: 4px solid #1a1108; box-shadow: inset -4px -4px #4a3b2c, inset 4px 4px #110a05; }
        .bubble-me-minecraft { background-color: #5c8e32; color: #ffffff; border: 3px solid #3c5e20; border-radius: 4px; }
        .bubble-them-minecraft { background-color: #706253; color: #ffffff; border: 3px solid #4a3e33; border-radius: 4px; }

        /* Combined Theme (Anomalous Matrix Core) */
        body.theme-combined { background-color: #0a0f1d; font-family: 'Share Tech Mono', monospace; color: #38bdf8; }
        .panel-combined { background-color: rgba(13, 20, 38, 0.9); border: 1px dashed #38bdf8; box-shadow: 0 0 25px rgba(244, 63, 94, 0.2), inset 0 0 15px rgba(56, 189, 248, 0.1); }
        .bubble-me-combined { background-color: #881337; color: #fda4af; border: 1px solid #f43f5e; border-radius: 16px 16px 4px 16px; }
        .bubble-them-combined { background-color: #0c4a6e; color: #bae6fd; border: 1px solid #0284c7; border-radius: 16px 16px 16px 4px; }

        .terminal-scroll::-webkit-scrollbar { width: 5px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 9px; }
        .pulse-mic { animation: recordFlash 1s infinite alternate; }
        @keyframes recordFlash { 0% { box-shadow: 0 0 0px rgba(239,68,68,0); } 100% { box-shadow: 0 0 20px rgba(239,68,68,1); background-color: #ef4444; } }
    </style>
</head>
<body class="theme-scp h-screen w-screen flex items-center justify-center p-3">

    <!-- SIGN-IN SECURITY PORTAL -->
    <div id="auth-screen" class="w-full max-w-md bg-black/90 p-8 rounded border border-emerald-900/60 shadow-[0_0_30px_rgba(16,185,129,0.2)] animate__animated animate__zoomIn">
        <h1 class="text-center text-xl font-bold tracking-widest text-emerald-400 mb-6 uppercase">WhatsApp // Tactical Core Setup</h1>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="CODENAME ACCOUNT" class="w-full bg-zinc-950 border border-emerald-900/60 p-3 text-emerald-400 font-mono text-xs focus:outline-none focus:border-emerald-400 rounded">
            <input type="password" id="password" placeholder="PASSPHRASE DEPLOYMENT KEY" class="w-full bg-zinc-950 border border-emerald-900/60 p-3 text-emerald-400 font-mono text-xs focus:outline-none focus:border-emerald-400 rounded">
            <div class="flex gap-3 pt-2">
                <button onclick="handleAuth('/api/login')" class="flex-1 bg-emerald-950/60 border border-emerald-500 text-emerald-400 py-3 text-xs uppercase tracking-wider font-bold hover:bg-emerald-500 hover:text-black transition rounded">Login</button>
                <button onclick="handleAuth('/api/register')" class="flex-1 bg-zinc-900 border border-zinc-700 text-zinc-400 py-3 text-xs uppercase tracking-wider hover:bg-zinc-700 hover:text-white transition rounded">Register</button>
            </div>
        </div>
    </div>

    <!-- MAIN IMMERSIVE CHAT LOG MATRIX INTERFACE -->
    <div id="chat-screen" class="hidden w-full h-[94vh] max-w-6xl rounded flex overflow-hidden shadow-2xl transition-all duration-300">
        
        <!-- SIDEBAR LEFT CONTAINER: CONTACTS PANEL & WHATSAPP PROFILE STYLES -->
        <div id="left-panel" class="w-80 border-r border-white/10 flex flex-col justify-between">
            <div>
                <!-- User Status Banner Header -->
                <div class="p-4 border-b border-white/10 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                        <span id="user-display" class="font-bold text-sm tracking-wide"></span>
                    </div>
                    <button onclick="logout()" class="text-[10px] opacity-60 hover:opacity-100 hover:underline border border-white/20 px-2 py-0.5 rounded transition">DISCONNECT</button>
                </div>

                <!-- WHATSAPP SCHEME SELECTOR: SYSTEM PROFILE SKIN CORES -->
                <div class="p-3 border-b border-white/10 bg-black/30">
                    <label class="block text-[10px] tracking-wider uppercase opacity-60 mb-1.5 font-bold">🎨 Select Client Visual Matrix Layer</label>
                    <select id="theme-selector" onchange="swapActiveTheme(this.value)" class="w-full bg-black/60 border border-white/20 p-2 text-xs rounded font-mono focus:outline-none">
                        <option value="scp">Aesthetic Alpha: SCP Terminal Secure Layout</option>
                        <option value="minecraft">Aesthetic Beta: Minecraft Recipe Grid</option>
                        <option value="combined">Aesthetic Gamma: Combined Anomalous Fusion</option>
                    </select>
                </div>

                <!-- Chat Rooms Feed -->
                <div class="p-2">
                    <div class="p-3 bg-white/5 rounded border border-white/10 flex items-center gap-3 cursor-pointer">
                        <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold text-xs">💬</div>
                        <div class="flex-1">
                            <div class="text-xs font-bold tracking-wide flex justify-between">[GLOBAL CORE STREAM] <span class="text-[9px] opacity-40">Live</span></div>
                            <p class="text-[11px] opacity-60 truncate mt-0.5">Continuous synchronization transmission loop...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-3 bg-black/40 border-t border-white/10 text-[9px] text-center opacity-40 font-mono tracking-tighter">
                REPLICA ENGINE RECONSTRUCT v4.81 — PERSISTENT SQL ARCHIVE ACTIVE
            </div>
        </div>
        <!-- RIGHT PANEL: CHAT TIMELINE STREAM FRAME WORKSPACE -->
        <div class="flex-1 flex flex-col h-full bg-black/20 relative">
            
            <!-- Real-Time Conversational Feed Track Grid -->
            <div id="messages-container" class="flex-1 p-5 overflow-y-auto space-y-3.5 terminal-scroll"></div>

            <!-- Operational Control Box Line Input Row -->
            <div class="p-4 border-t border-white/10 bg-black/40 flex items-center gap-3">
                <input type="text" id="message-input" placeholder="Type verified encrypted message packet..." class="flex-1 bg-black/50 border border-white/20 rounded-lg p-3 text-xs focus:outline-none focus:border-white/40 transition font-mono">
                
                <!-- Native Dynamic Core Voice Node Capture Trigger -->
                <button id="voice-btn" onclick="toggleVoiceRecord()" class="bg-black/50 border border-white/20 p-3 rounded-lg hover:bg-white hover:text-black transition duration-150 flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>

                <button onclick="sendText()" class="bg-white/10 border border-white/40 px-5 py-3 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white hover:text-black transition duration-200">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') 
            ? 'http://127.0.0.1:8000' 
            : window.location.origin;
            
        let socket, mediaRecorder, audioChunks = [], isRecording = false, currentUser = "", currentTheme = "scp";

        // Autologin System Pipeline Routine Checks
        window.addEventListener('load', async () => {
            const savedToken = localStorage.getItem('scp_session_token');
            if (savedToken) {
                try {
                    const response = await fetch(`${BACKEND_URL}/api/verify`, {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    });
                    const data = await response.json();
                    if (data.success) {
                        currentUser = data.username;
                        currentTheme = data.theme;
                        launchSecureChat(data.username);
                    } else { localStorage.removeItem('scp_session_token'); }
                } catch (e) { console.error("Database Engine offline or unreachable."); }
            }
        });

        async function handleAuth(endpoint) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if(!username || !password) return alert("System Parameters error.");

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(!res.ok) return alert(`ACCESS DENIED: ${data.detail || "Authentication Failed"}`);

                localStorage.setItem('scp_session_token', data.token);
                currentUser = data.username;
                currentTheme = data.theme || "scp";
                launchSecureChat(data.username);
            } catch(e) { alert("Core Database Node handshake failure."); }
        }

        function launchSecureChat(username) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = username.toUpperCase();
            
            // Render active skin alignment configuration parameters
            applyThemeClasses(currentTheme);
            document.getElementById('theme-selector').value = currentTheme;

            socket = io(BACKEND_URL, { path: "/socket.io" });
            socket.emit('join', username);
            socket.on('receiveMessage', (msg) => { renderIncomingMessage(msg); });
        }

        async function swapActiveTheme(newTheme) {
            currentTheme = newTheme;
            applyThemeClasses(newTheme);
            const token = localStorage.getItem('scp_session_token');
            if(token) {
                await fetch(`${BACKEND_URL}/api/theme`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ theme: newTheme })
                });
            }
        }

        function applyThemeClasses(theme) {
            document.body.className = `theme-${theme}`;
            const leftPanel = document.getElementById('left-panel');
            leftPanel.className = `w-80 border-r border-white/10 flex flex-col justify-between panel-${theme}`;
        }

        function logout() {
            localStorage.removeItem('scp_session_token');
            window.location.reload();
        }

        function sendText() {
            const input = document.getElementById('message-input');
            if(!input.value.trim()) return;
            socket.emit('sendMessage', { text: input.value });
            input.value = '';
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('voice-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => { socket.emit('sendMessage', { voice: reader.result }); };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('pulse-mic');
                } catch (err) { alert("Microphone hardware stream trace blocked."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('pulse-mic');
            }
        }

        function renderIncomingMessage(msg) {
            const container = document.getElementById('messages-container');
            const item = document.createElement('div');
            
            // Check self vs external packet sender to align bubbles left or right exactly like WhatsApp
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            item.className = `w-full flex ${isMe ? 'justify-end' : 'justify-start'}`;

            const bubbleClass = isMe ? `bubble-me-${currentTheme}` : `bubble-them-${currentTheme}`;
            
            let messageContent = "";
            if (msg.text) {
                messageContent = `<p class="text-xs font-mono leading-relaxed select-all">${msg.text}</p>`;
            } else if (msg.voice) {
                messageContent = `<audio controls src="${msg.voice}" class="w-56 mt-1 h-7 rounded"></audio>`;
            }

            item.innerHTML = `
                <div class="${bubbleClass} p-3 max-w-md shadow-md animate__animated animate__fadeInUp relative">
                    <div class="flex justify-between items-center gap-4 text-[9px] opacity-40 font-bold mb-1">
                        <span>${msg.sender.toUpperCase()}</span>
                        <span>${msg.timestamp}</span>
                    </div>
                    ${messageContent}
                </div>
            `;
            
            container.appendChild(item);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
